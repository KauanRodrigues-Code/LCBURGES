<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>LC BURGERS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-header">
  <div class="header-content">
    <h1>LC BURGERS</h1>
    <p>De Terça a Domingo • 18:00 às 23:00</p>
  </div>
</header>

<section class="categories">
  <button class="category-btn active" onclick="filterCategory('tradicionais')">Tradicionais</button>
  <button class="category-btn" onclick="filterCategory('gourmets')">Gourmets</button>
  <button class="category-btn" onclick="filterCategory('combos')">Combos</button>
  <button class="category-btn" onclick="filterCategory('bebidas')">Bebidas</button>
</section>

<section class="products" id="products"></section>

<button class="floating-cart" id="floating-cart" onclick="toggleCart()">
  🛍 <span id="cart-count">0</span>
</button>

<div class="cart" id="cart">
  <div class="cart-header">
    <h2>Sua Sacola</h2>
    <button class="close-cart" onclick="toggleCart()">✕</button>
  </div>

  <div class="cart-scrollable-content">
    <div class="cart-items" id="cart-items"></div>

    <div class="cart-section-card">
      <h3>📍 Entrega</h3>
      <select id="delivery-type" onchange="toggleDeliveryFields()">
        <option value="entrega">Preciso de Entrega (Taxa R$ 5,00)</option>
        <option value="retirada">Vou retirar no Balcão</option>
      </select>

      <div id="address-fields">
        <input type="text" id="cart-rua" placeholder="Nome da Rua">
        <div class="input-row">
          <input type="text" id="cart-numero" placeholder="Nº">
          <input type="text" id="cart-vila" placeholder="Bairro">
        </div>
        <select id="home-type">
          <option value="Casa">Casa</option>
          <option value="Apartamento">Apartamento</option>
        </select>
        <input type="text" id="cart-ponto-ref" placeholder="Ponto de referência">
      </div>
    </div>

    <div class="cart-section-card">
      <h3>💳 Pagamento</h3>
      <select id="payment-method" onchange="toggleTrocoField()">
        <option value="Pix">Pix</option>
        <option value="Cartão">Cartão</option>
        <option value="Dinheiro">Dinheiro</option>
      </select>

      <div id="troco-field" style="display:none">
        <input type="text" id="cart-troco" placeholder="Troco para quanto?">
      </div>
    </div>
  </div>

  <div class="cart-footer">
    <div id="cart-total"></div>
    <button onclick="finishOrder()" class="finish-btn">
      Concluir Pedido no WhatsApp
    </button>
  </div>
</div>

<!-- MODAL DE ADICIONAIS -->
<div id="extras-modal" class="extras-modal">
  <div class="extras-box">
    <h3>Escolha os adicionais</h3>
    <div id="extras-list"></div>
    <div class="extras-footer">
      <strong id="extras-total">Total: R$ 0,00</strong>
      <button onclick="confirmExtras()">Adicionar</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
