<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>LC BURGERS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-header">
  <div class="header-content">
    <h1>LC BURGERS</h1>
    <p>De Terça a Domingo • 18:00 às 23:00</p>
  </div>
</header>

<section class="categories">
  <button class="category-btn active" onclick="filterCategory('tradicionais')">Tradicionais</button>
  <button class="category-btn" onclick="filterCategory('gourmets')">Gourmets</button>
  <button class="category-btn" onclick="filterCategory('bebidas')">Bebidas</button>
</section>

<section class="products" id="products"></section>

<button class="floating-cart" onclick="toggleCart()">🛍 <span id="cart-count">0</span></button>

<div class="cart" id="cart">
  <div class="cart-header">
    <h2>Sua Sacola</h2>
    <button onclick="toggleCart()">✕</button>
  </div>

  <div class="cart-items" id="cart-items"></div>

  <div class="cart-footer">
    <strong id="cart-total">Total: R$ 0,00</strong>
    <button onclick="finishOrder()">Concluir Pedido</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
